name: Build

# Builds the Spreach Desktop Companion (Rust/Tauri, from masesk/spreach-dekstop-companion)
# for Windows, macOS and Linux, and publishes the installers as a GitHub release.
#
# Release by pushing a tag here (git tag v1.2.0 && git push origin v1.2.0), or run this
# workflow manually with the tag. Tags must look like v1.2.3: the number becomes the app
# version, and Windows MSI installers only accept plain numeric versions.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
      source_ref:
        description: 'Branch, tag or commit of spreach-dekstop-companion to build'
        required: false
        default: main

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ONNX Runtime's prebuilt Linux library needs GCC 13's libstdc++, so Linux builds on
        # 24.04 (the app then needs glibc 2.39+, e.g. Ubuntu 24.04 or Debian 13).
        os: [ubuntu-24.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Check tag format
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3"
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: masesk/spreach-dekstop-companion
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.GH_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app

      # espeak-ng's library is compiled from source: needs CMake and libclang, which the
      # Windows and macOS runners already have.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev cmake libclang-dev

      # The npm package ships a prebuilt Tauri CLI.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installers
        working-directory: tauri-app/src-tauri
        # The tag's version overrides the one in tauri.conf.json.
        run: |
          npx --yes @tauri-apps/cli@2 build --config "{\"version\": \"$VERSION\"}"

      - uses: actions/upload-artifact@v4
        with:
          name: Spreach-${{ runner.os }}
          if-no-files-found: error
          path: |
            tauri-app/target/release/bundle/msi/*.msi
            tauri-app/target/release/bundle/nsis/*.exe
            tauri-app/target/release/bundle/dmg/*.dmg
            tauri-app/target/release/bundle/deb/*.deb
            tauri-app/target/release/bundle/appimage/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            artifacts/Spreach-Windows/**/*.exe
            artifacts/Spreach-Windows/**/*.msi
            artifacts/Spreach-macOS/**/*.dmg
            artifacts/Spreach-Linux/**/*.deb
            artifacts/Spreach-Linux/**/*.AppImage

      - name: Delete artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[].id' | \
            xargs -I {} gh api repos/${{ github.repository }}/actions/artifacts/{} -X DELETE
